[project]
name = "sage-assistant"
version = "0.1.0"
description = "Assistant Windows compagnon de Sage 50 pour importer Microstore et injecter des lignes facture."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.2",
    "pypdf>=6.0.0",
    "pyside6>=6.7.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
sage-assistant = "app.main:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
